services:

  backend:

    build:
      context: ./backend

    container_name: search-backend

    ports:
      - "8000:8000"

    depends_on:

      milvus-standalone:

        condition: service_healthy

    environment:

      PYTHONUNBUFFERED: 1

    networks:
      - search-network


  frontend:

    build:
      context: ./frontend

    container_name: search-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    networks:
      - search-network


  milvus-etcd:

    container_name: milvus-etcd

    image: quay.io/coreos/etcd:v3.5.5

    environment:

      ETCD_AUTO_COMPACTION_MODE: revision

      ETCD_AUTO_COMPACTION_RETENTION: 1000

      ETCD_QUOTA_BACKEND_BYTES: 4294967296

      ETCD_SNAPSHOT_COUNT: 50000

    command:

      etcd

      -advertise-client-urls=http://milvus-etcd:2379

      -listen-client-urls=http://0.0.0.0:2379

      --data-dir=/etcd

    volumes:

      - ./volumes/etcd:/etcd

    healthcheck:

      test:

        [
          "CMD",
          "etcdctl",
          "endpoint",
          "health"
        ]

      interval: 30s

      timeout: 20s

      retries: 3

    networks:

      - search-network


  milvus-minio:

    container_name: milvus-minio

    image: minio/minio:RELEASE.2023-03-20T20-16-18Z

    environment:

      MINIO_ACCESS_KEY: minioadmin

      MINIO_SECRET_KEY: minioadmin

    command:

      minio server /minio_data --console-address ":9001"

    ports:

      - "9000:9000"

      - "9001:9001"

    volumes:

      - ./volumes/minio:/minio_data

    healthcheck:

      test:

        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]

      interval: 30s

      timeout: 20s

      retries: 3

    networks:

      - search-network


  milvus-standalone:

    container_name: milvus-standalone

    image: milvusdb/milvus:v2.4.12

    command:

      ["milvus","run","standalone"]

    security_opt:

      - seccomp:unconfined

    environment:

      ETCD_ENDPOINTS: milvus-etcd:2379

      MINIO_ADDRESS: milvus-minio:9000

      MINIO_ACCESS_KEY: minioadmin

      MINIO_SECRET_KEY: minioadmin

    volumes:

      - ./volumes/milvus:/var/lib/milvus

    ports:

      - "19530:19530"

      - "9091:9091"

    depends_on:

      milvus-etcd:

        condition: service_healthy

      milvus-minio:

        condition: service_healthy

    healthcheck:

      test:

        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9091/healthz"
        ]

      interval: 30s

      start_period: 90s

      timeout: 20s

      retries: 3

    networks:

      - search-network


networks:

  search-network:

    name: search-network